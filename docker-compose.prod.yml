services:
  postgres:
    image: postgres:16-alpine
    container_name: judge_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-judge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-judge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - judge_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-judge_user} -d ${POSTGRES_DB:-judge_db}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: judge_prod_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - judge_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    container_name: judge_prod_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - judge_network
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  create-buckets:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    container_name: judge_prod_minio_init
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - judge_network
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ['mc']
    command:
      - mb
      - --ignore-existing
      - local/${MINIO_BUCKET_NAME:-judge-testcases}

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: judge_prod_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-judge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-judge_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-judge-testcases}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - judge_network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    container_name: judge_prod_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-judge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-judge_db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-judge-testcases}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-2000}
      SANDBOX_MEMORY_LIMIT_MB: ${SANDBOX_MEMORY_LIMIT_MB:-128}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - judge_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: judge_prod_frontend
    restart: unless-stopped
    ports:
      - '${PROD_PORT:-80}:80'
    depends_on:
      - api
    networks:
      - judge_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  judge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
